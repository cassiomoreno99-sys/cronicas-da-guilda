name: Verificar arena 2D oficial
on:
  push:
    branches: [combate-2d-unico-aprovado-20261013]
    paths:
      - ".github/workflows/arena-2d-only.yml"
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar jogo, saves e empacotamento offline
        run: npm run build
      - name: Instalar Chromium de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar jogo
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/guilda-vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/guilda-vite.log
          exit 1
      - name: Testar combate único no computador e celular
        run: node scripts/test-single-battle-ui.mjs
      - name: Guardar capturas para inspeção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacao-arena-2d
          path: visual-report/single-battle-*.jpg
          if-no-files-found: ignore

# Revisão 2: testes atualizados para interface única, sem arena cinematográfica.

