name: Auditoria crítica - Descanso e Combate
on:
  push:
    branches: [main, auditoria-critica-inconsistencias-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilação e regressão completa
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Regras de descanso e 18 combates
        run: node --experimental-strip-types scripts/test-auditoria-critica.ts
      - name: Preparar navegador
        run: |
          npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Testar Santuário e Taverna 320 390 e 1024
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          ID=$!
          trap "kill $ID 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173 -o /dev/null; then break; fi; sleep 1; done
          node scripts/test-auditoria-critica-browser.mjs
