name: Biblioteca 84 Artes - QA
on:
  push:
    branches: [estrutura-identidade-artes-herois-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Preparar artes, testes históricos, tipos e build completo
        run: npm run build
      - name: Garantir que novas imagens apareçam no manifesto e não haja duplicidade
        run: |
          node scripts/generate-hero-art-manifest.mjs
          node --experimental-strip-types scripts/test-hero-identity.ts
      - name: Conferência final de arquivos
        run: |
          git status --short
          test -f dist/index.html
          test -f lib/hero-art-manifest.ts
