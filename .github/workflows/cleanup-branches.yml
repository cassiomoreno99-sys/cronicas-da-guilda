name: Limpar branches antigas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apagar branches obsoletas
        run: |
          git push origin --delete             audit-v1.2.3             backup-main-before-ui-fix-2026-10-07             clean-ui-v140             fix-expedition-slots-v1.2.5             major-v130-world             multi-expedicoes-v1.2.4             ui-mockups-exatos
