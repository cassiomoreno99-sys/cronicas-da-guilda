name: Limpar branches temporárias v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover branches temporárias
        run: |
          git push origin --delete             canonical-base-v5             canonical-base-v5-fixed             canonical-base-v5-ready             cleanup-data-assets-v5             cleanup-data-assets-v5b
