name: Fase 1 - corrigir visual de Thorgar
on:
  push:
    branches: [fase-1-correcao-visual-20261014]
    paths: ['.github/workflows/fase1-arte-anão.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sprite-anao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar imagem
        run: |
          python -m pip install --quiet pillow
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 140 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:f55ccc62-1d04-46e7-8098-e1e24469b6a4' -o /tmp/anao-thorgar.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/anao-thorgar.png').convert('RGBA')
          alpha=im.getchannel('A')
          lo,hi=alpha.getextrema()
          assert lo<10 and hi>245, f'O sprite deve ter transparencia: {lo},{hi}'
          b=alpha.getbbox()
          assert b is not None
          l,t,r,bb=b
          pad=12
          im=im.crop((max(0,l-pad),max(0,t-pad),min(im.width,r+pad),min(im.height,bb+pad)))
          im.save('public/battle/sprite-thorgar.webp',format='WEBP',quality=91,method=6,exact=True)
          assert im.width>=350 and im.height>=650
          print('Thorgar, raça ANÃO, novo boneco:',im.size)
          PY
      - name: Registrar novo sprite no ramo de revisão
        run: |
          git config user.name "Guilda QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/battle/sprite-thorgar.webp
          git diff --cached --quiet && exit 0
          git commit -m "Fase 1: substituir arqueiro elfico por Thorgar anao com martelo runico"
          git push origin HEAD:fase-1-correcao-visual-20261014
