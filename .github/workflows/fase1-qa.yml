name: Fase 1 - verificar jogo e interface
on:
  push:
    branches: [fase-1-correcao-visual-20261014]
    paths: [".github/workflows/fase1-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar código, estados, saves e build offline
        run: npm run build
      - name: Validar requisitos da Fase 1
        run: node scripts/test-fase1-ui.mjs
      - name: Instalar navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Servir build de produção
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/fase1-vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/fase1-vite.log
          exit 1
      - name: Validar Taverna, Guilda e heróis em desktop e celular
        run: node scripts/test-fase1-browser.mjs
      - name: Capturas para conferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase1-capturas
          path: visual-report/fase1-*.jpg
          if-no-files-found: ignore
