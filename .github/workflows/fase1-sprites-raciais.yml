name: Fase 1 - sprites raciais
on:
  push:
    branches: [fase-1-correcao-visual-20261014]
    paths: ['.github/workflows/fase1-sprites-raciais.yml']
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar sprites transparentes de raças
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import urlopen, Request
          from PIL import Image
          urls={
           "rhokar":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:89994ef3-d431-4b13-9010-cc33692fd4e8",
           "orc":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c4c1b060-0cd7-4fae-bf95-2207d48a33e6"
          }
          folder=Path("public/battle")
          for name,url in urls.items():
              with urlopen(Request(url,headers={"User-Agent":"Guilda-Assets"}),timeout=120) as f: raw=f.read()
              src=Image.open(BytesIO(raw)).convert("RGBA")
              low,high=src.getchannel("A").getextrema()
              assert low<10 and high>245,(name,low,high)
              bb=src.getchannel("A").getbbox()
              assert bb is not None
              l,t,r,b=bb; pad=12
              src=src.crop((max(0,l-pad),max(0,t-pad),min(src.width,r+pad),min(src.height,b+pad)))
              assert src.width>350 and src.height>500
              dest=folder/f"sprite-{name}.webp"
              src.save(dest,format="WEBP",quality=91,method=6,exact=True)
              assert dest.stat().st_size>20000
              print(name,src.size,dest.stat().st_size)
          PY
      - name: Salvar novos sprites no ramo da Fase 1
        run: |
          git config user.name "Guilda QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/battle/sprite-rhokar.webp public/battle/sprite-orc.webp
          git diff --cached --quiet && exit 0
          git commit -m "Fase 1: adicionar sprites coerentes com as racas bestial e orc"
          git push origin HEAD:fase-1-correcao-visual-20261014
