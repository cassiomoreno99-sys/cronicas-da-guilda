name: Fase 2 - calendário e inventário
on:
  push:
    branches: [fase-2-tempo-bau-equipamentos-20261014]
    paths: ['.github/workflows/fase2-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Executar testes do calendário, inventário e equipamentos
        run: node --experimental-strip-types scripts/test-fase2.ts
      - name: Executar toda a regressão e compilar o jogo offline
        run: npm run build
      - name: Instalar Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Servir jogo
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/fase2-vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/fase2-vite.log
          exit 1
      - name: Teste visual do jogo mobile e desktop
        run: node scripts/test-fase2-browser.mjs
      - name: Enviar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2-capturas
          path: visual-report/fase2-*.jpg
          if-no-files-found: ignore

