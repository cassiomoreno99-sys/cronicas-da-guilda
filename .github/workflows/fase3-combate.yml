name: Fase 3 - Combate 2D QA
on:
  push:
    branches: [main, fase3-combate-2d-tatico-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilacao e regressao
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Combates estrategicos e salvamentos
        run: node --experimental-strip-types scripts/test-fase3-combate.ts
      - name: Preparar Playwright
        run: |
          npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Arena mobile e desktop
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          ID=$!
          trap "kill $ID 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173 -o /dev/null; then break; fi; sleep 1; done
          node scripts/test-fase3-combate-browser.mjs
