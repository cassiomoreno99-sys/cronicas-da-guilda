name: Fases 4 a 9 - Auditoria Final
on:
  push:
    branches: [main, auditoria-fases-4-a-9-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fases4a9:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar todo o jogo e compilar
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Testar seis fases e integridade do save
        run: node --experimental-strip-types scripts/test-fases4-a-9.ts
      - name: Instalar Playwright
        run: |
          npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Navegador 320 390 1024 e recuperação
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          ID=$!
          trap "kill $ID 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173 -o /dev/null; then break; fi; sleep 1; done
          node scripts/test-fases4-a-9-browser.mjs
