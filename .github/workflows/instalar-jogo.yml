name: Instalar pacote do jogo

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado na raiz."
            exit 1
          fi

          rm -rf _pacote
          mkdir _pacote
          unzip -q "$ZIP" -d _pacote

          SRC="$(find _pacote -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SRC" ]; then
            SRC="_pacote"
          fi

          shopt -s dotglob nullglob
          for item in "$SRC"/*; do
            cp -a "$item" .
          done

          rm -rf _pacote
          rm -f "$ZIP"

      - name: Gravar versão do jogo
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git commit -m "Publica pacote atualizado do Crônicas da Guilda"
          git push
