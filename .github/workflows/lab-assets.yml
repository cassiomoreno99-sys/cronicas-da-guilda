name: Laboratório 2D - preparar arte aprovada
on:
  push:
    branches: [laboratorio-combate-2d-visual-corrigido]
    paths: ['.github/workflows/lab-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python3 -m pip install --user pillow
      - name: Gerar sprites recortados e transparentes da arte aprovada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen, Request
          from io import BytesIO
          from PIL import Image, ImageStat
          base=Path("laboratorio-combate-2d/art")
          base.mkdir(parents=True,exist_ok=True)
          sources={"aric":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:258282bf-297f-4294-a34b-927b479a1646","lyria":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7391aeae-98ec-4ec2-bf46-856116689da0","thorgar":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:fde3f2df-da88-4574-8b9b-5f4e5d076a35","kaelith":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:195c9b7b-637a-4aee-b3dc-6c18e6e0a7bc","cultista":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:4370e47c-bb36-4d17-811b-e3403defb281","espectro":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:e8441e12-5788-455b-a4e6-cb15a59968e6","esqueleto":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:381a6509-236f-47be-840d-6b45ab97a11a","necromante":"https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:b77cf7f6-0727-4bcb-926e-305c692bc051"}
          for name,url in sources.items():
              print("Baixando personagem:",name,flush=True)
              req=Request(url,headers={"User-Agent":"Guilda-RPG-Assets/1.0"})
              with urlopen(req,timeout=100) as res:
                  raw=res.read()
              src=Image.open(BytesIO(raw)).convert("RGBA")
              alpha=src.getchannel("A")
              if alpha.getextrema()[0] >= 250:
                  raise RuntimeError(f"Imagem sem transparencia: {name}")
              bbox=alpha.getbbox()
              if bbox is None:
                  raise RuntimeError(f"Imagem transparente vazia: {name}")
              l,t,r,b=bbox
              pad=12
              box=(max(0,l-pad),max(0,t-pad),min(src.width,r+pad),min(src.height,b+pad))
              sprite=src.crop(box)
              target=base/("sprite-"+name+".webp")
              sprite.save(target,format="WEBP",quality=92,method=6,exact=True)
              print(name, sprite.size, target.stat().st_size,"bytes",flush=True)
          PY
      - name: Salvar sprites reais no ramo independente
        run: |
          git config user.name "Guilda Assets Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add laboratorio-combate-2d/art/sprite-*.webp
          git commit -m "Adicionar oito personagens reais com transparencia para animações do RPG 2D"
          git push origin HEAD:laboratorio-combate-2d-visual-corrigido
