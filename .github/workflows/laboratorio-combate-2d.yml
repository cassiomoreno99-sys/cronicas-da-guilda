name: Laboratório de combate 2D (sem publicar)
on:
  push:
    branches: [laboratorio-combate-2d-fluido-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-laboratorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Identidade real de cada habilidade
        run: node --experimental-strip-types scripts/test-combat-visual-cues.ts
      - name: Coreografia real (6 dimensões)
        run: node --experimental-strip-types scripts/test-combat-choreography.ts
      - name: Validar camadas visuais
        run: node --experimental-strip-types scripts/test-combat-vfx.ts
      - name: Verificar habilidades reais
        run: node --experimental-strip-types scripts/test-habilidades-laboratorio.ts
      - name: Verificar preservação de combate e TypeScript
        run: npm run build
      - name: Preparar navegador de auditoria (apenas CI)
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar servidor temporário do laboratório
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/guilda-laboratorio.log 2>&1 &
          for i in {1..50}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/guilda-laboratorio.log
          exit 1
      - name: Fotografar e verificar arena (6 tamanhos, inclusive Android)
        run: node scripts/test-excelencia-2d-browser.mjs
      - name: Gravar confronto animado e barra de habilidades (laboratório)
        run: node scripts/gravar-combate-laboratorio.mjs
      - name: Guardar capturas para revisão, sem publicar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-combate-2d-capturas
          path: |\n            visual-report/excelencia-2d-*.jpg\n            visual-report/lab-combate-*.webm\n            visual-report/lab-*.png
          if-no-files-found: ignore
