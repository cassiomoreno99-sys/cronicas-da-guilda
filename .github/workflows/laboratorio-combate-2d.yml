name: Laboratório de combate 2D (sem publicar)
on:
  push:
    branches: [laboratorio-combate-2d-fluido-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-laboratorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Verificar rig humanoide isolado
        run: |
          node --experimental-strip-types scripts/test-combat-body-rig.ts
          node scripts/test-combat-body-rig-ui.mjs
      - name: Identidade real de cada habilidade
        run: node --experimental-strip-types scripts/test-combat-visual-cues.ts
      - name: Bloco 08 - 6 resoluções e colisões
        run: node --experimental-strip-types scripts/test-combat-arena-movement.ts
      - name: Coreografia real (6 dimensões)
        run: node --experimental-strip-types scripts/test-combat-choreography.ts
      - name: Validar camadas visuais
        run: node --experimental-strip-types scripts/test-combat-vfx.ts
      - name: Verificar habilidades reais
        run: node --experimental-strip-types scripts/test-habilidades-laboratorio.ts
      - name: Integração de movimento e sombra
        run: node scripts/test-combat-arena-integration.mjs
      - name: Bloco 09A - estilos físicos e equipamentos
        run: node --experimental-strip-types scripts/test-combat-physical-strikes.ts
      - name: Bloco 09B - integração física sem duplicar magia
        run: node scripts/test-combat-physical-integration.mjs
      - name: Bloco 10A - magias da campanha
        run: node --experimental-strip-types scripts/test-combat-spell-plan.ts
      - name: Verificar preservação de combate e TypeScript
        run: npm run build
      - name: Preparar navegador de auditoria (apenas CI)
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar servidor temporário do laboratório
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/guilda-laboratorio.log 2>&1 &
          for i in {1..50}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/guilda-laboratorio.log
          exit 1
      - name: Fotografar e verificar arena (6 tamanhos, inclusive Android)
        run: node scripts/test-excelencia-2d-browser.mjs
      - name: Revisar articulação e fallback Android / desktop
        run: node scripts/test-body-rig-browser.mjs
      - name: Bloco 08 - movimento real Android e desktop
        run: node scripts/test-arena-movement-browser.mjs
      - name: Bloco 09C - golpes reais Android e PC
        run: node scripts/test-physical-strikes-browser.mjs
      - name: Gravar confronto animado e barra de habilidades (laboratório)
        run: node scripts/gravar-combate-laboratorio.mjs
      - name: Guardar capturas para revisão, sem publicar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-combate-2d-capturas
          path: |
            visual-report/excelencia-2d-*.jpg
            visual-report/lab-combate-*.webm
            visual-report/lab-*.png
            visual-report/rig07-*.png
            visual-report/rig08-*.png
            visual-report/rig09-*.png
          if-no-files-found: ignore
