name: Aplicar patch visual v1.2.1

on:
  push:
    paths:
      - "scripts/patch-v121.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --quiet pillow

      - name: Aplicar correções
        run: python scripts/patch-v121.py

      - name: Gravar v1.2.1
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git commit -m "Corrige retratos e layout mobile v1.2.1"
          git push
