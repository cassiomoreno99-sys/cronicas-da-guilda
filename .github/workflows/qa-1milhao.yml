name: Auditoria extrema - 120000 dias e 1200000 probabilidades
on:
  push:
    branches: [qa-120000-dias-1200000-probabilidades-20261017]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  longrun:
    name: "Dias ${{ matrix.shard }} - campanha real"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rodar 24000 dias com ações reais, Liga, Copa, economia e saves
        env:
          QA_SHARD: ${{ matrix.shard }}
        run: node --experimental-strip-types scripts/test-120000-dias.ts
      - name: Preservar evidências do perfil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longrun-${{ matrix.shard }}
          path: qa-report/longrun-${{ matrix.shard }}.json
          if-no-files-found: ignore
  probability:
    name: "Probabilidades ${{ matrix.shard }} - 150000 ensaios"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Executar avaliações probabilísticas reais do motor e persistência
        env:
          QA_SHARD: ${{ matrix.shard }}
        run: node --experimental-strip-types scripts/test-1200000-probabilidades.ts
      - name: Preservar evidências probabilísticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probabilities-${{ matrix.shard }}
          path: qa-report/probabilities-${{ matrix.shard }}.json
          if-no-files-found: ignore
  regressions:
    name: Regressões oficiais, 7500 cenários e novos conjuntos
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build geral
        run: npm run build
      - name: Conjuntos e efeitos reais
        run: |
          node --experimental-strip-types scripts/test-conjuntos-estrategicos.ts
          node --experimental-strip-types scripts/test-conjuntos-efeitos-combate.ts
      - name: Evitar W.O. permanente após transferência pelo Conselho
        run: node --experimental-strip-types scripts/test-transferencia-escalacao.ts
      - name: Liga e contratação
        run: |
          node --experimental-strip-types scripts/test-liga-escalacao-isolada.ts
          node --experimental-strip-types scripts/test-ranking-recrutamento.ts
          node --experimental-strip-types scripts/test-rumores-taverna.ts
      - name: Economia e saves
        run: |
          node --experimental-strip-types scripts/test-recompensas-bau-cheio.ts
          node --experimental-strip-types scripts/test-auditoria-critica.ts
          node --experimental-strip-types scripts/test-6000-cenarios.ts
  audit-summary:
    name: Confirmar resultado de todas as 13 partições
    if: always()
    needs: [longrun,probability,regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Validar execução integral
        env:
          DAYS: ${{ needs.longrun.result }}
          PROBS: ${{ needs.probability.result }}
          REGRESS: ${{ needs.regressions.result }}
        run: |
          echo "Dias: $DAYS"
          echo "Probabilidades: $PROBS"
          echo "Regressões: $REGRESS"
          test "$DAYS" = success
          test "$PROBS" = success
          test "$REGRESS" = success
          echo "120.000 dias, 1.200.000 avaliações, regressões: todos concluídos com sucesso."
