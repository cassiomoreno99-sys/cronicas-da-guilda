name: QA recrutamento - 9000 simulacoes
on:
  push:
    branches: [corrigir-botoes-recrutamento-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  QA-botoes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias e build do jogo com 84 retratos
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Chromium e Playwright para testes de tela real
        run: |
          npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Testar 9.000 grupos reais e aleatorios no Chromium
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null || true" EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          node --experimental-strip-types scripts/test-recruit-visual.mjs
      - name: Salvar capturas mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recrutamento-mobile-alinhado
          path: qa-recrutamento/*.png
          if-no-files-found: ignore
