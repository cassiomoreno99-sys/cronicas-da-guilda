name: Fase 1 - Interface mobile QA
on:
  push:
    branches: [main, fase1-balanceamento-60dias-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias e preparar aplicativo
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build
      - name: Preparar Chromium com Playwright
        run: |
          npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verificar envio de expedicoes nos celulares
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          ID=$!
          trap "kill $ID 2>/dev/null || true" EXIT
          for n in $(seq 1 40);do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-fase1-economia-browser.mjs
      - name: Guardar capturas das 3 telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase1-orcamento-320-390-1024
          path: visual-report/fase1-orcamento-*.png
          if-no-files-found: ignore
