name: Sete melhorias - estrategia e Android
on:
  push:
    branches: [sete-melhorias-completas-20261017]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regras das sete melhorias e 160 campanhas de teste
        run: node --experimental-strip-types scripts/test-sete-melhorias.ts
      - name: Preparar dependências
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Compilar para produção
        run: npm run build
      - name: Regressões de Liga, combate, Taverna e equipamentos
        run: |
          node --experimental-strip-types scripts/test-liga-escalacao-isolada.ts
          node --experimental-strip-types scripts/test-auditoria-critica.ts
          node --experimental-strip-types scripts/test-conjuntos-estrategicos.ts
          node --experimental-strip-types scripts/test-rumores-taverna.ts
      - name: Bateria de milhares de cenários
        run: node --experimental-strip-types scripts/test-6000-cenarios.ts
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Playwright e navegador
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm install --no-save --no-audit --no-fund --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Compilar e validar no Android simulado
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173 -o /dev/null; then break; fi; sleep 1; done
          node scripts/test-sete-melhorias-browser.mjs
  longevity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Simular 500 temporadas e salvar progresso
        run: node --experimental-strip-types scripts/test-500-temporadas.ts
