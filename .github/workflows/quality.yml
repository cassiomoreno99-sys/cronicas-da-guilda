name: Verificar jogo

on:
  push:
    branches:
      - main
      - clean-ui-v140
      - frontend-rebuild-mobile-v1
  pull_request:
    branches:
      - main

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar tipos e build
        run: npm run build
