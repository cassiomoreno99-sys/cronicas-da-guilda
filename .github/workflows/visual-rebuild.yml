name: Revisão visual mobile

on:
  push:
    branches: [frontend-rebuild-mobile-v1]
    paths-ignore:
      - "visual-report/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "visual-report/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Iniciar jogo
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log
          exit 1
      - run: node scripts/visual-smoke.mjs
      - name: Auditar excelência do 2D em seis resoluções, quatro contra quatro e sprites estáveis
        run: node scripts/test-excelencia-2d-browser.mjs
      - name: Verificar imagens grandes da Sede e coreografia em cinco telas Android/desktop
        run: node scripts/test-combate-epico-browser.mjs
      - name: Guardar capturas como artefatos de QA (não publicar no jogo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisao-visual-mobile
          path: |
            visual-report/*.png
            visual-report/excelencia-2d-*.jpg
          if-no-files-found: ignore
