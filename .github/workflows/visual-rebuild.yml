name: Revisão visual mobile

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "visual-report/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Iniciar jogo
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:5173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log
          exit 1
      - run: node scripts/visual-smoke.mjs
      - name: Publicar capturas na branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-report
          git diff --cached --quiet && exit 0
          git commit -m "Visual snapshots mobile"
          git push origin HEAD:${{ github.head_ref }}
