 $('embers').setAttribute('transform',`translate(${(mx-63).toFixed(1)} ${ (310-hit*18).toFixed(1)})`);$('embers').setAttribute('opacity',(hit*.8).toFixed(2));
 $('hero-hp').style.width=(100-peak(t,1.81,.4)*4)+'%';$('monster-hp').style.width=(100-(t>=3.8?26* Math.min(1,(t-3.8)/.4):0))+'%';
 const label=$('status');if(t>=1.65&&t<2.36){label.textContent='BLOQUEIO PERFEITO';label.className='status block';label.style.opacity=Math.min(1,(t-1.65)*7,(2.36-t)*7).toFixed(2)}else if(t>=3.46&&t<4.34){label.textContent='CONTRA-ATAQUE!';label.className='status counter';label.style.opacity=Math.min(1,(t-3.46)*8,(4.34-t)*6).toFixed(2)}else{label.style.opacity='0'} }
window.renderFrame=render;const tick=now=>{if(playing){let t=(now-started)/1000;render(t);paused=t%D}requestAnimationFrame(tick)};requestAnimationFrame(tick);
$('play').addEventListener('click',()=>{playing=!playing;if(playing){started=performance.now()-paused*1000;$('play').textContent='Pausar duelo'}else $('play').textContent='Continuar duelo'});$('restart').addEventListener('click',()=>{started=performance.now();paused=0;render(0);playing=true;$('play').textContent='Pausar duelo'});
})();
</script></body></html>
