function val(name,t){const a=keys[name];for(let i=1;i<a.length;i++)if(t<a[i][0]){const p=a[i-1],q=a[i],u=ease((t-p[0])/(q[0]-p[0]));return p[1]+(q[1]-p[1])*u}return a[a.length-1][1]}
function peak(t,c,w){return clamp(1-Math.abs(t-c)/w)}
function step(t,c,w){return Math.pow(peak(t,c,w),1.4)}
function trans(id,x,y){$(id).setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`)}
function spin(id,d,x,y){$(id).setAttribute('transform',`rotate(${d.toFixed(2)} ${x} ${y})`)}
function render(t){t=((t%D)+D)%D;
 const hx=val('hx',t),mx=val('mx',t),impact1=peak(t,2.19,.17),impact2=peak(t,4.23,.19);
 const shake=impact1*5.5+impact2*10;trans('camera',Math.sin(t*180)*shake,Math.cos(t*151)*shake*.45);
 let breath=t<.82||t>6.5?Math.sin(t*3)*1.5:0;
 trans('hero',hx,425+val('hy',t)+breath);trans('monster-pos',mx,426+val('my',t)+Math.sin(t*3.2)*1.4);
 $('hero-body').setAttribute('transform',`translate(0 ${(-130+val('hcrouch',t)).toFixed(1)}) rotate(${val('hlean',t).toFixed(2)} 0 45)`);
 // Cape follows torso with delay: it swings backwards during the charge, then catches up at impact.
 const cape=step(t,4.02,.7)*-19+step(t,2.17,.42)*10+Math.sin(t*4)*2;
 $('hero-cape').setAttribute('transform',`rotate(${cape.toFixed(2)} -13 -118)`);
 $('hero-shield-arm').setAttribute('transform',`translate(69 0) rotate(${val('hshield',t).toFixed(2)} -28 8)`);
 spin('hero-sword-arm',val('hsarm',t),25,8);spin('hero-sword',val('hsword',t),55,56);
 spin('hero-leg-back',val('hleg1',t),-16,-76);spin('hero-leg-front',val('hleg2',t),5,-77);
 spin('monster-body',val('mlean',t),0,-94);spin('monster-front-arm',val('marm',t),38,-168);
 spin('monster-back-arm',val('mback',t),-45,-180);spin('monster-leg-front',val('mleg1',t),5,-94);
 spin('monster-leg-back',val('mleg2',t),-38,-95);spin('monster-head',Math.sin(t*3)*2+step(t,4.43,.5)*28,14,-221);
 spin('hero-head',Math.sin(t*3)*1.5-step(t,2.22,.3)*9+step(t,4.2,.32)*5,0,-65);
 spin('monster-tail',Math.sin(t*4.2)*12-step(t,4.52,.65)*19,-38,-114);
 $('hero-shadow').setAttribute('cx',hx);$('monster-shadow').setAttribute('cx',mx);
 $('hero-shadow').setAttribute('rx',(80+step(t,3.97,.44)*22+step(t,2.19,.22)*9).toFixed(2));
 $('monster-shadow').setAttribute('rx',(118+step(t,2.18,.3)*18+step(t,4.62,.45)*27).toFixed(2));
 const mdust=Math.min(1,step(t,1.31,.36)*.72+step(t,1.7,.2)*.83+step(t,2.21,.32)*.95+step(t,4.65,.45)*.83);
 trans('monster-step-dust',mx-8,422);$('monster-step-dust').setAttribute('opacity',mdust.toFixed(2));
 const hdust=Math.min(1,step(t,2.19,.3)*.4+step(t,3.8,.3)*.85+step(t,4.2,.3)*.94+step(t,5.28,.3)*.5);
 trans('hero-step-dust',hx+5,423);$('hero-step-dust').setAttribute('opacity',hdust.toFixed(2));
 trans('dust',t<3.2?mx-10:hx+7,415);$('dust').setAttribute('opacity',(impact1*.4+impact2*.47).toFixed(2));
 const shield=peak(t,2.20,.29);$('shield-impact').setAttribute('transform',`translate(${(hx+60).toFixed(2)} 315) scale(${(.43+shield*.67).toFixed(2)})`);$('shield-impact').setAttribute('opacity',(.87*shield).toFixed(2));
 const arc=step(t,4.105,.37);$('blade-trail').setAttribute('transform',`translate(${(hx+82).toFixed(2)} 306) rotate(${((t-4.08)*63).toFixed(2)}) scale(1.02)`);$('blade-trail').setAttribute('opacity',arc.toFixed(2));
 $('monster-hit').setAttribute('transform',`translate(${(mx-66).toFixed(2)} 299) scale(${(.56+impact2*.38).toFixed(2)})`);$('monster-hit').setAttribute('opacity',(impact2*.88).toFixed(2));
 $('embers').setAttribute('transform',`translate(${(mx-66).toFixed(2)} ${(299-impact2*20).toFixed(2)})`);$('embers').setAttribute('opacity',(impact2*.88).toFixed(2));
 $('ground-crack').setAttribute('transform',`translate(${(hx+43).toFixed(2)} 420)`);$('ground-crack').setAttribute('opacity',(impact2*.57).toFixed(2));
 $('hero-hp').style.width='100%';$('monster-hp').style.width=(100-(t>=4.21?30*ease((t-4.21)/.42):0)).toFixed(2)+'%';

 if(t>=4.01&&t<5.02){copy='GOLPE PESADO';kind='counter';alpha=Math.min(1,(t-4.01)*8,(5.02-t)*5)}
 label.textContent=copy;label.className='status '+kind;label.style.opacity=Math.max(0,alpha).toFixed(2);
}
window.renderFrame=render;
const tick=now=>{if(playing){const t=(now-started)/1000*speed;render(t);paused=t%D}requestAnimationFrame(tick)};requestAnimationFrame(tick);
const audio=$('audio-track');
function resumeAudio(){if(sound){audio.currentTime=paused;audio.play().catch(()=>{});}}
$('play').addEventListener('click',()=>{playing=!playing;if(playing){started=performance.now()-paused*1000/speed;$('play').textContent='Pausar duelo';resumeAudio()}else{$('play').textContent='Continuar duelo';audio.pause()}});
$('restart').addEventListener('click',()=>{started=performance.now();paused=0;playing=true;$('play').textContent='Pausar duelo';render(0);audio.pause();audio.currentTime=0;resumeAudio()});
$('speed').addEventListener('click',()=>{speed=speed===1?.65:speed===.65?1.35:1;started=performance.now()-paused*1000/speed;$('speed').textContent=`Velocidade: ${speed}×`;audio.playbackRate=speed});
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'Desativar som':'Ativar som';if(sound&&playing)resumeAudio();else audio.pause()});
})();
